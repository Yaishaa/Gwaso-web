<h2 mat-dialog-title>{{ donnees.ustensile ? "Modifier l'ustensile" : 'Nouvel ustensile' }}</h2>
<mat-dialog-content>
  <app-ustensile-formulaire
    [ustensile]="donnees.ustensile"
    [nomInitial]="donnees.nomInitial ?? ''"
    (enregistre)="fenetre.close($event)"
    (annule)="fenetre.close($event ?? undefined)"
  />
</mat-dialog-content>
