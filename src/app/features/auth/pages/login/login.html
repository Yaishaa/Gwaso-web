<main class="page-connexion">
  <div class="colonne">
    <img class="logo apparition" src="images/logo-gwaso.png" alt="Gwaso" width="120" height="128" />

    <section class="carte apparition" aria-labelledby="titre-connexion">
      <p class="surtitre">Administration</p>
      <h1 id="titre-connexion">Bon retour parmi nous</h1>
      <p class="sous-titre">Connectez-vous pour veiller sur la communauté Gwaso.</p>

      @if (erreur()) {
        <div class="message-erreur" role="alert">
          <ng-icon name="lucideCircleAlert" size="1.25rem" aria-hidden="true" />
          <p>{{ erreur() }}</p>
        </div>
      }

      <form [formGroup]="formulaire" (ngSubmit)="connecter()" novalidate>
        <mat-form-field class="champ">
          <mat-label>Email ou téléphone</mat-label>
          <ng-icon matPrefix class="icone-champ" name="lucideUser" size="1.125rem" aria-hidden="true" />
          <input matInput formControlName="identifiant" autocomplete="username" />
          <mat-error>Saisissez votre email ou votre numéro de téléphone.</mat-error>
        </mat-form-field>

        <mat-form-field class="champ">
          <mat-label>Mot de passe</mat-label>
          <ng-icon matPrefix class="icone-champ" name="lucideKeyRound" size="1.125rem" aria-hidden="true" />
          <input
            matInput
            formControlName="motDePasse"
            autocomplete="current-password"
            [type]="motDePasseVisible() ? 'text' : 'password'"
          />
          <button
            matIconButton
            matSuffix
            type="button"
            [attr.aria-label]="motDePasseVisible() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
            [attr.aria-pressed]="motDePasseVisible()"
            (click)="basculerMotDePasse()"
          >
            <ng-icon [name]="motDePasseVisible() ? 'lucideEyeOff' : 'lucideEye'" size="1.25rem" aria-hidden="true" />
          </button>
          <mat-error>Saisissez votre mot de passe.</mat-error>
        </mat-form-field>

        <button matButton="filled" type="submit" class="bouton-connexion" [disabled]="enCours()">
          @if (enCours()) {
            <mat-progress-spinner mode="indeterminate" diameter="20" aria-hidden="true" />
            Connexion en cours…
          } @else {
            Se connecter
            <ng-icon class="fleche" name="lucideArrowRight" size="1.125rem" aria-hidden="true" />
          }
        </button>
      </form>
    </section>

    <p class="devise apparition">Apprendre · Cuisiner · Transmettre</p>
  </div>
</main>
